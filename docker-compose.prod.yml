# Example docker compose file for running the complete MediaSet stack in production
#
# This file includes all services: API, UI, and MongoDB
#
# Prerequisites:
# - Set required environment variables in a .env file or pass them directly
#
# Required environment variables:
#   - MONGO_ROOT_PASSWORD: password for the MongoDB root user (used when the bundled mongo service first initializes)
#   - MONGO_APP_PASSWORD: password for the "mediaset" MongoDB user the API connects as
#   - MONGODB_CONNECTION_STRING: (optional) full connection string; overrides the built-in mongo service credentials
#   - AllowedHosts: Semicolon-separated list of hostnames/IPs the API is reachable at (e.g., sub.domain.com)
#
# Optional environment variables (for barcode/metadata lookup features):
#   - OPENLIBRARY_CONTACT_EMAIL: Your email for OpenLibrary API (required for book lookup)
#   - TMDB_BEARER_TOKEN: TMDB API bearer token (required for movie lookup)
#   - IgdbConfiguration__ClientId: Twitch/IGDB Client ID (required for game lookup)
#   - IgdbConfiguration__ClientSecret: Twitch/IGDB Client Secret (required for game lookup)
#   - MUSICBRAINZ_USER_AGENT: MusicBrainz user agent (optional, e.g., "MyApp/1.0 (contact@example.com)")
#   - UPCITEMDB_API_KEY: UpcItemDb API key (optional, but improves lookup accuracy)

version: "3.8"

services:
  mediaset-api:
    image: ghcr.io/paulmfischer/mediaset-api:latest
    container_name: mediaset-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Core API settings
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"

      # Restrict accepted Host headers to prevent host header injection attacks.
      # Set this to the hostname(s) or IP(s) your instance is reachable at.
      # Semicolon-separated. Use a leading dot for subdomain wildcards: .domain.com
      # If accessed on a non-standard port, include it: 192.168.1.10:8080
      # See Setup/CONTAINER_SETUP.md for full details.
      AllowedHosts: "[ReplaceThis]"

      # Timezone configuration (defaults to UTC if not set)
      # Set this to your local timezone for accurate scheduling and logs
      # Examples: America/New_York, Europe/London, Asia/Tokyo
      # See: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      # TZ: "America/New_York"

      # Database configuration
      # Authenticated as the per-app "mediaset" user (readWrite on the MediaSet database only).
      # Set MONGODB_CONNECTION_STRING to point at a different server (e.g. a shared MongoDB).
      MediaSetDatabaseSettings__ConnectionString: "${MONGODB_CONNECTION_STRING:-mongodb://mediaset:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/MediaSet?authSource=MediaSet}"
      MediaSetDatabaseSettings__DatabaseName: "MediaSet"

      # Cache settings
      CacheSettings__EnableCaching: "true"
      CacheSettings__DefaultCacheDurationMinutes: "10"
      CacheSettings__MetadataCacheDurationMinutes: "10"
      CacheSettings__StatsCacheDurationMinutes: "10"

      # Image storage configuration
      ImageConfiguration__StoragePath: "/app/data/images"
      ImageConfiguration__MaxFileSizeMb: "5"
      ImageConfiguration__AllowedImageExtensions: "jpg,jpeg,png"
      ImageConfiguration__HttpTimeoutSeconds: "30"

      # OpenLibrary configuration (for book lookup)
      # OpenLibraryConfiguration__BaseUrl: "https://openlibrary.org/"
      # OpenLibraryConfiguration__Timeout: "30"
      # OpenLibraryConfiguration__ContactEmail: "[ReplaceThis]"

      # TMDB configuration (for movie lookup)
      # TmdbConfiguration__BaseUrl: "https://api.themoviedb.org/3/"
      # TmdbConfiguration__BearerToken: "[ReplaceThis]"
      # TmdbConfiguration__Timeout: "10"

      # UpcItemDb configuration (for barcode lookup)
      # Free tier: 100 requests/day, 6 requests/minute burst
      # UpcItemDbConfiguration__BaseUrl: "https://api.upcitemdb.com/"
      # UpcItemDbConfiguration__Timeout: "10"
      # UpcItemDbConfiguration__MaxRequestsPerMinute: "5"
      # UpcItemDbConfiguration__MaxRequestsPerDay: "90"
      # UpcItemDbConfiguration__MinDelayBetweenRequestsMs: "1000"
      # UpcItemDbConfiguration__MaxRetryPauseSeconds: "65"

      # IGDB configuration (for game lookup)
      # IgdbConfiguration__ClientId: "[ReplaceThis]"        # Twitch Client ID
      # IgdbConfiguration__ClientSecret: "[ReplaceThis]"    # Twitch Client Secret

      # MusicBrainz configuration (for music lookup)
      # MusicBrainzConfiguration__BaseUrl: "https://musicbrainz.org/"
      # MusicBrainzConfiguration__Timeout: "10"
      # MusicBrainzConfiguration__UserAgent: "${MUSICBRAINZ_USER_AGENT:-MediaSet/1.0 (https://github.com/paulmfischer/MediaSet)}"

      # Seq logging configuration (for centralized structured logging)
      # See Setup/SEQ_SETUP.md for detailed configuration guide
      # ExternalLogging__Enabled: "true"
      # ExternalLogging__SeqUrl: "[ReplaceThis]"

      # HTTP logging exclusions (reduces noise in logs by excluding specific paths)
      # HttpLoggingFilterOptions__ExcludedPaths__0: "/health"
      # HttpLoggingFilterOptions__ExcludedPaths__1: "/health/ready"
      # HttpLoggingFilterOptions__ExcludedPaths__2: "/health/live"
      # HttpLoggingFilterOptions__ExcludePathStartsWith__0: "/api/health"
      # HttpLoggingFilterOptions__ExcludePathStartsWith__1: "/swagger"

      # Background image lookup service configuration
      # Automatically finds and downloads cover images for entities missing them
      # See Setup/BACKGROUND_IMAGE_LOOKUP_SETUP.md for detailed configuration guide
      # BackgroundImageLookupConfiguration__Enabled: "true"
      # BackgroundImageLookupConfiguration__Schedule: "0 2 * * *"
      # BackgroundImageLookupConfiguration__MaxRuntimeMinutes: "60"
      # BackgroundImageLookupConfiguration__BatchSize: "25"
      # BackgroundImageLookupConfiguration__RequestsPerMinute: "5"  # Reduced from 30 to respect UpcItemDb limits

    volumes:
      # Persist uploaded images
      - mediaset-images:/app/data/images

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - mediaset

  mediaset-ui:
    image: ghcr.io/paulmfischer/mediaset-ui:latest
    container_name: mediaset-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-side API URL - for Remix server to call API (uses Docker container name)
      apiUrl: "${API_URL:-http://mediaset-api:8080}"

      # Client-side API URL - for browser to access API (must be externally accessible)
      # In production, this should be the public URL of your API
      clientApiUrl: "[ReplaceThis]"

      # Node environment
      NODE_ENV: "production"

      # Seq logging configuration (for structured logging from Remix server)
      # Uses the same variable as the API — set once to enable both services
      # ExternalLogging__SeqUrl: "http://seq:5341"

      # Optional: Enable detailed error messages (not recommended for production)
      # SHOW_ERROR_DETAILS: "false"

    depends_on:
      - mediaset-api

    networks:
      - mediaset

  mongo:
    image: mongo:8.0
    container_name: mediaset-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: "MediaSet"
      # Authentication is on. The root user and the per-app user are only created on first
      # start with an empty mediaset-db volume (see mongo-init/01-create-app-user.js).
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}"
      APP_DB_NAME: "MediaSet"
      APP_DB_USER: "mediaset"
      APP_DB_PASSWORD: "${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}"
    volumes:
      - mediaset-db:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mediaset

volumes:
  mediaset-db:
    driver: local
  mediaset-images:
    driver: local

networks:
  mediaset:
    driver: bridge
