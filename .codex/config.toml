# Shared guards. Existing local hooks.json is intentionally preserved.
[[hooks.PreToolUse]]
matcher = "Bash"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/scripts/agents/codex_git_guard.py"'
timeout = 10

[[hooks.PreToolUse]]
matcher = "apply_patch"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/scripts/agents/codex_env_guard.py"'
timeout = 10
