name: PR Checks

on:
  pull_request:
    branches:
      - main
      - "feat/*"
      - "feature/*"
      - "fix/*"
      - "chore/*"

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', '**/NuGet.Config', '**/nuget.config') }}

      - name: Restore API dependencies
        id: restore
        run: dotnet restore MediaSet.sln

      - name: Check PR whitespace
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA" --

      - name: Build API
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet build MediaSet.sln --no-restore

      - name: Test API
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet test MediaSet.Api.Tests/MediaSet.Api.Tests.csproj --no-restore

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MediaSet.Remix
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: MediaSet.Remix/package-lock.json

      - name: Install UI dependencies
        id: install
        run: npm ci

      - name: Lint UI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check UI formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:format

      - name: Check UI types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Build UI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Test UI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  ui-browser:
    name: UI Browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MediaSet.Remix
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: MediaSet.Remix/package-lock.json

      - name: Install UI dependencies
        run: npm ci

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test UI in browser
        run: npm run test:e2e
