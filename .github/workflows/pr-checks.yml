name: PR Checks

on:
  pull_request:
    branches:
      - main
      - "feature/*"
      - "fix/*"
      - "chore/*"

permissions:
  contents: read

jobs:
  verification:
    name: Full Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache project dependencies
        uses: actions/cache@v4
        with:
          path: |
            .agent-local/nuget
            .agent-local/npm-cache
          key: ${{ runner.os }}-agent-dependencies-${{ hashFiles('.nvmrc', 'global.json', '**/*.csproj', 'MediaSet.Remix/package-lock.json') }}

      # Explicit preparation; diagnosis and verification never install tools.
      - name: Restore project dependencies
        run: bash scripts/agents/setup.sh bootstrap

      # Full mode works with the shallow detached checkout, without branch refs.
      # Diagnostics go to the job console; local verification logs are not uploaded.
      - name: Run full shared verification
        run: python3 -B scripts/agents/verify.py --full --show-output
