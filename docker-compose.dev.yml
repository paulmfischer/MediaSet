# Local development runs the API and UI on the host. Only MongoDB is containerized.
services:
  mongodb:
    image: docker.io/mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: MediaSet
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}"
      APP_DB_NAME: MediaSet
      APP_DB_USER: mediaset
      APP_DB_PASSWORD: "${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}"
    volumes:
      # Separate from the retired stack's data/mongodb; local dev data is disposable.
      - ./data/dev-mongodb:/data/db:Z
      - ./mongo-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      # Authenticate as the application user and exercise its read permission.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$APP_DB_USER" --password "$$APP_DB_PASSWORD"
          --authenticationDatabase "$$APP_DB_NAME" "$$APP_DB_NAME"
          --eval 'db.getCollectionNames();'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
